name: Section quality candidate
on:
  push:
    branches: ['test/section-quality-preflight']
permissions:
  contents: read
concurrency:
  group: section-quality-test2
  cancel-in-progress: true
jobs:
  source:
    if: github.ref == 'refs/heads/test/section-quality-preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Materialize locally tested source, only on the isolated branch
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/test/section-quality-preflight
          if test -f .candidate/section-ui-v2.patch.b64; then
            python - <<'PY_PATCH'
          import base64, lzma, hashlib, subprocess
          from pathlib import Path
          encoded=Path('.candidate/section-ui-v2.patch.b64').read_text().strip()
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='426461cc2cac8206b229604940c77f2325b195426a9be60e615b9b398c1e88a7'
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          subprocess.run(['git','rm','.candidate/section-ui-v2.patch.b64'],check=True)
          PY_PATCH
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(test): retain selected quality while rechecking section support'
            git push origin HEAD:refs/heads/test/section-quality-preflight
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test "$(tr -d '\r\n ' < VERSION)" = 2.0.0
  linux-checks:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fixture and browser tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ffmpeg fonts-noto-cjk
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          mkdir -p section-evidence
      - name: Regression, race and actual MP4/HLS partial-transfer proof
        working-directory: src
        env:
          CLIPCATCH_SECTION_MEDIA_TEST: '1'
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout=5m -v ./... | tee ../section-evidence/linux-tests.log
          go vet ./...
      - name: Extension and actual browser controls
        run: |
          set -euo pipefail
          node --test tests/browser-core.test.mjs tests/feed-core.test.mjs tests/feed-worker.test.mjs tests/transfer-state.test.mjs | tee section-evidence/extension-tests.log
          python tests/section_ui.py
          python tests/section_popup_ui.py
          git rev-parse HEAD > section-evidence/source-commit.txt
          git archive --format=zip --output=section-evidence/ClipCatch-section-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ClipCatch-section-Linux-evidence
          path: section-evidence/
          retention-days: 14
  windows-candidate:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify official media tools and pinned existing bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force section-evidence, src/quality_bundle, dist-section | Out-Null
          $archive=Join-Path $env:RUNNER_TEMP 'section-ffmpeg.zip'
          $url='https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          $sums=(Invoke-WebRequest ($url+'.sha256') -TimeoutSec 30).Content
          $match=[regex]::Match([string]$sums,'(?i)[a-f0-9]{64}')
          if (-not $match.Success) { throw 'No FFmpeg verification hash' }
          curl.exe -fL --retry 2 --max-time 180 $url -o $archive
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg download failed' }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $match.Value.ToLowerInvariant()) { throw 'FFmpeg SHA256 mismatch' }
          Expand-Archive $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'section-ffmpeg')
          $ff=Get-ChildItem (Join-Path $env:RUNNER_TEMP 'section-ffmpeg') -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ff) { throw 'FFmpeg executable missing' }
          $ff.DirectoryName | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          & $ff.FullName -version | Out-File section-evidence/ffmpeg-version.txt -Encoding utf8
          curl.exe -fL --retry 2 --max-time 180 https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip -o src/quality_bundle/windows.zip
          if ($LASTEXITCODE -ne 0) { throw 'Existing bundle download failed' }
          if ((Get-FileHash src/quality_bundle/windows.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'abc02804e17982a3be33675e4d471e91ea374e65b70167abc09e31acb412802d') { throw 'Existing bundle checksum mismatch' }
          python -m pip install Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Pillow install failed' }
      - name: Native Windows unit and actual media regression
        working-directory: src
        shell: pwsh
        env:
          CLIPCATCH_SECTION_MEDIA_TEST: '1'
        run: |
          go test -tags bundled_ai -count=1 -timeout=6m -v ./... 2>&1 | Tee-Object ../section-evidence/windows-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows regression failed' }
          go vet -tags bundled_ai ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows vet failed' }
      - name: Read-only preflight for reported YouTube link (not a download test)
        continue-on-error: true
        shell: pwsh
        run: |
          $tool=Join-Path $env:RUNNER_TEMP 'yt-dlp-section-probe.exe'
          $sums=Join-Path $env:RUNNER_TEMP 'yt-dlp-section-sums.txt'
          curl.exe -fL --retry 1 --max-time 60 https://github.com/yt-dlp/yt-dlp/releases/latest/download/SHA2-256SUMS -o $sums
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic engine checksum unavailable' }
          curl.exe -fL --retry 1 --max-time 120 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o $tool
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic engine unavailable' }
          $line=Get-Content $sums | Where-Object { $_ -match '^[0-9a-fA-F]{64}\s+\*?yt-dlp\.exe$' } | Select-Object -First 1
          if (-not $line) { throw 'Diagnostic checksum not found' }
          $want=($line -split '\s+')[0].ToLowerInvariant()
          if ((Get-FileHash $tool -Algorithm SHA256).Hash.ToLowerInvariant() -ne $want) { throw 'Diagnostic checksum mismatch' }
          & $tool --version | Out-File section-evidence/diagnostic-engine-version.txt -Encoding utf8
          $env:CLIPCATCH_DIAGNOSTIC_YTDLP=$tool
          Push-Location src
          try {
            go test -run '^TestSectionLiveYouTubePreflight$' -count=1 -timeout=45s -v . 2>&1 | Tee-Object ../section-evidence/youtube-preflight.log
            if ($LASTEXITCODE -ne 0) { throw 'Read-only diagnostic failed' }
          } finally {
            Pop-Location
            Remove-Item Env:CLIPCATCH_DIAGNOSTIC_YTDLP -ErrorAction SilentlyContinue
          }
      - name: Build distinct portable SECTION TEST executable
        shell: pwsh
        run: |
          python tools/windows_resources.py --version 2.1.0-test.2 --section-test
          if ($LASTEXITCODE -ne 0) { throw 'Candidate resources failed' }
          $env:CGO_ENABLED='0'
          Push-Location src
          try {
            go build -tags bundled_ai -trimpath '-ldflags=-s -w -H windowsgui -X main.appVersion=2.1.0-test.2 -X main.appChannel=section-test' -o ../dist-section/ClipCatch-SectionTest.exe .
            if ($LASTEXITCODE -ne 0) { throw 'Candidate compilation failed' }
          } finally { Pop-Location }
          $v=(Get-Item dist-section/ClipCatch-SectionTest.exe).VersionInfo
          if ($v.FileDescription -ne 'ClipCatch SECTION TEST' -or $v.OriginalFilename -ne 'ClipCatch-SectionTest.exe' -or $v.FileVersion -ne '2.1.0-test.2') { throw 'Windows candidate identity mismatch' }
      - name: Verify actual EXE and production data isolation
        shell: pwsh
        run: |
          python tests/section_windows.py dist-section/ClipCatch-SectionTest.exe section-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Native candidate verification failed' }
          Copy-Item section-evidence/SHA256SUMS dist-section/SHA256SUMS
          Copy-Item section-evidence/candidate-build-info.json dist-section/build-info.json
          Copy-Item docs/SECTION_TEST.md dist-section/TEST_SCOPE.md
          @'
          ClipCatch SECTION TEST 2.1.0-test.2

          ClipCatch-SectionTest.exe를 실행하세요. 기존 운영판과 TEST2는 교체하지 않습니다.
          주소: http://127.0.0.1:18767
          저장 폴더: 다운로드/ClipCatch-SectionTest

          1. 링크 한 개를 넣으면 화질과 부분 다운로드 가능 여부를 확인합니다.
          2. 화질 아래의 [구간만 저장]을 체크하면 시·분·초 숫자칸이 활성화됩니다.
          3. 시작/종료 값을 직접 입력하고 다운로드합니다. 임의의 여유 구간은 추가하지 않습니다.
          4. 미지원 또는 확인 불가이면 구간 다운로드는 시작하지 않습니다. 전체 영상으로 자동 전환하지 않습니다.

          이 버전은 UI와 미지원 사유 안내를 수정한 시험판입니다. 새 영상 형식 지원이나 속도 향상을 추가하지 않았습니다.
          정확한 구간은 H.264/AAC MP4로 재압축합니다. 모든 영상 형식과 플랫폼 성공을 보장하지 않습니다.
          레딧은 시험판의 별도 확장 ClipCatch Browser SECTION TEST에서 재생 영상을 선택합니다.
          기존 운영 확장프로그램을 시험판 확장으로 덮어쓰지 마세요.
          이전 SECTION TEST가 열려 있으면 그 화면의 프로그램 종료를 누른 뒤 새 시험판을 실행하세요.
          정식 배포판이 아닙니다. 자세한 지원 범위는 TEST_SCOPE.md를 확인하세요.
          '@ | Set-Content dist-section/README.txt -Encoding utf8
          git rev-parse HEAD | Set-Content dist-section/SOURCE_COMMIT.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: ClipCatch-SECTION-TEST-2.1.0-test.2
          path: dist-section/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ClipCatch-section-Windows-evidence
          path: section-evidence/
          retention-days: 14
