name: Prepare approved folder foreground candidate
on:
  push:
    branches: [fix/clipcatch-folder-foreground-198]
    paths: [dev/FOLDER198_READY, tools/prepare_folder198.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/clipcatch-folder-foreground-198'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      - name: Materialize explicit source edits in the candidate only
        run: |
          set -euo pipefail
          python tools/prepare_folder198.py
          gofmt -w src/folder*.go src/main.go src/release196_test.go
          git diff --check
          (cd src && go test -count=1 ./... && GOOS=windows GOARCH=amd64 go vet ./...)
      - name: Record source without merging or publishing
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/clipcatch-folder-foreground-198
          git rm tools/prepare_folder198.py
          git add src tests VERSION docs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: materialize exact-folder foreground activation and upgrade regressions'
          git push origin HEAD:refs/heads/fix/clipcatch-folder-foreground-198
          git archive --format=zip --output=ClipCatch-198-candidate-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ClipCatch-198-candidate-source
          path: ClipCatch-198-candidate-source.zip
          retention-days: 14
