name: Prepare simple folder candidate
on:
  push:
    branches: [fix/clipcatch-simple-folder-199]
    paths: [tools/prepare_folder199.py]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      - name: Apply explicit candidate edits and test
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/clipcatch-simple-folder-199
          python tools/prepare_folder199.py
          gofmt -w src/folder_open*.go src/main.go src/release196_test.go
          git diff --check
          (cd src && go test -count=1 ./... && go vet ./...)
          git rm tools/prepare_folder199.py
          git add src tests VERSION
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: simplify folder opening to direct visible Explorer launch'
          git push origin HEAD:refs/heads/fix/clipcatch-simple-folder-199
          git archive --format=zip --output=ClipCatch-199-candidate-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ClipCatch-199-candidate-source
          path: ClipCatch-199-candidate-source.zip
          retention-days: 14
