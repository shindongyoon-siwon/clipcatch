name: Premiere compatibility checks
on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**', '.github/workflows/premiere-compatibility.yml']
permissions:
  contents: read
concurrency:
  group: premiere-${{ github.ref }}
  cancel-in-progress: true
jobs:
  media-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture reviewed source snapshot
        run: git archive --format=zip HEAD -o source-snapshot.zip
      - uses: actions/upload-artifact@v4
        with:
          name: premiere-source-snapshot
          path: source-snapshot.zip
          retention-days: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.mod
      - name: Verify source
        working-directory: src
        run: |
          go test ./...
          go vet ./...
