name: ClipCatch Windows Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "src/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clipcatch-release
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Test and compile Windows executable
        id: build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n ' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cd src
          go test ./...
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -H windowsgui -X main.appVersion=$VERSION" \
            -o ../dist/ClipCatch.exe .
          cd ../dist
          sha256sum ClipCatch.exe > SHA256SUMS
          test -s ClipCatch.exe

      - name: Check public Reddit page media on PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          cd src
          go test -run '^TestRedditPublicPageLive$' -v .

      - name: Publish new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump VERSION before publishing."
            exit 1
          fi
          gh release create "$TAG" dist/ClipCatch.exe dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "ClipCatch $TAG" \
            --notes "Windows 64-bit. Download ClipCatch.exe once; future updates are installed in ClipCatch."
