name: Apply reviewed browser bridge
on:
  push:
    branches: [feat/reddit-browser-bridge-v1.7.0]
    paths:
      - maintenance/browser-v170.*
      - .github/workflows/apply-browser-bridge.yml
permissions:
  contents: write
concurrency:
  group: apply-browser-bridge
  cancel-in-progress: true
jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reddit-browser-bridge-v1.7.0
      - name: Validate and apply immutable patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          names=['part1','part2','part3a','part3b','part3c']
          encoded=''.join(pathlib.Path('maintenance/browser-v170.'+n+'.b64').read_text().strip() for n in names)
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='fa3772c7533d803e90b472f2d5aad6b996cea576aeaeac3590ac011bf66f98bb','Patch checksum mismatch'
          pathlib.Path('/tmp/browser.patch').write_bytes(patch)
          PY
          git apply --check /tmp/browser.patch
          git apply /tmp/browser.patch
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and race checks
        run: |
          cd src
          go test -race ./...
          go vet ./...
          cd ..
          node --test tests/browser-core.test.mjs
      - name: Python test packages
        timeout-minutes: 3
        run: python -m pip install --disable-pip-version-check --timeout 30 --retries 2 yt-dlp playwright
      - name: Test Chromium
        timeout-minutes: 4
        run: python -m playwright install chromium
      - name: Test FFmpeg
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq; sudo apt-get install -y ffmpeg; fi
          ffmpeg -version | head -n 1
      - name: Actual engine and audio merge fixture
        working-directory: src
        env:
          CLIPCATCH_REAL_ENGINE_TEST: '1'
        run: go test -run '^TestBrowserRealEngine$' -v .
      - name: Actual Chromium extension handoff fixture
        run: python tests/browser_e2e.py
      - name: Windows compile
        working-directory: src
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags='-s -w -H windowsgui -X main.appVersion=1.7.0' -o /tmp/ClipCatch.exe .
      - name: Commit tested source on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests README.md
          git commit -m 'feat: verified Reddit-only browser media handoff'
          git push origin HEAD:feat/reddit-browser-bridge-v1.7.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-bridge-qa
          path: qa-output/
          retention-days: 1
          if-no-files-found: ignore
