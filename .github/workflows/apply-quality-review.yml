name: Apply reviewed quality source
on:
  push:
    branches: [feature/quality-tools-review]
    paths: [.github/workflows/apply-quality-review.yml]
permissions:
  contents: write
jobs:
  import-source:
    if: github.ref == 'refs/heads/feature/quality-tools-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quality-tools-review
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: false
      - name: Apply exact reviewed deadline guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/quality.go');s=p.read_text()
          before='ctx, stop := context.WithTimeout(ctx, 2*time.Hour)\n\tdefer stop()'
          after=before+'\n\tdefer a.finishQualityDeadline(ctx, id)'
          assert s.count(before)==1 and 'defer a.finishQualityDeadline' not in s
          p.write_text(s.replace(before,after))
          PY
          gofmt -w src/quality.go src/quality_deadline.go src/quality_deadline_test.go
          cd src
          go test ./...
          go vet ./...
      - name: Save only to review branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feature/quality-tools-review'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/quality.go src/quality_deadline.go src/quality_deadline_test.go
          git commit -m 'Finalize timeout state cleanup for optional local quality jobs'
          git push origin HEAD:refs/heads/feature/quality-tools-review
