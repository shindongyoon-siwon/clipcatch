name: Prepare reviewed updater repair candidate
on:
  push:
    branches: [fix/clipcatch-update-repair-197]
    paths: [dev/UPDATE197_READY]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/clipcatch-update-repair-197'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      - name: Materialize explicit source edits and validate
        run: |
          set -euo pipefail
          python tools/prepare_update197.py
          gofmt -w src/update_transaction*.go src/updater.go src/main.go src/release196_test.go
          git diff --check
          (cd src && go test -race -count=1 ./... && go vet ./...)
      - name: Record only this candidate source; no release
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/clipcatch-update-repair-197
          git add src tests VERSION docs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: materialize serialized updater with actual process exit and unique backups'
          git push origin HEAD:refs/heads/fix/clipcatch-update-repair-197
          git archive --format=zip --output=ClipCatch-197-candidate-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ClipCatch-197-candidate-source
          path: ClipCatch-197-candidate-source.zip
          retention-days: 14
