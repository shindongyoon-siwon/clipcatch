name: Materialize verified ClipCatch 2.0.0 changes
on:
  push:
    branches: ['release/2.0.0']
    paths: ['.github/workflows/materialize-2.0.0.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2.0.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, subprocess
          payload = '''
          
          
          '''
          patch = gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == '2f03bd951dd5a51ab0a9487e0dc2644e30f2fd5520e7d2725440e7a78f634ef8'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
      - name: Recheck source
        working-directory: src
        run: |
          go test -race -count=1 -timeout=120s ./...
          go vet ./...
      - name: Commit reviewed changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION docs/DEVELOPMENT_POLICY.md docs/releases/v2.0.0.md src tests/lifecycle200.py tests/windows_release196.py tests/windows_update198.py tests/windows_userflow199.py
          git diff --cached --check
          git commit -m 'feat: 2.0.0 activity-only updates and last-tab shutdown with Windows upgrade checks'
          git push origin HEAD:refs/heads/release/2.0.0
