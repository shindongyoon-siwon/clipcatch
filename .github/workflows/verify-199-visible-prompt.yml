name: Verify published v1.9.9 visible update prompt
on:
  push:
    branches: [qa/clipcatch-199-published-flow]
    paths: [.github/workflows/verify-199-visible-prompt.yml]
permissions:
  contents: read
  actions: read
jobs:
  published-user-paths:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      - uses: actions/download-artifact@v4
        with:
          name: ClipCatch-verified-stable
          path: dist
          run-id: 40479474058
          github-token: ${{ github.token }}
      - name: Use the actual visible prompt and observe automatic version reload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force public-evidence | Out-Null
          @'
          from pathlib import Path
          p=Path('tests/windows_userflow199.py')
          s=p.read_text(encoding='utf-8')
          old="page.locator('#installAppUpdate')"
          new="page.get_by_role('button', name='\uc5c5\ub370\uc774\ud2b8 \ud6c4 \ub2e4\uc2dc \uc2dc\uc791', exact=True)"
          assert s.count(old)==2, 'Unexpected test source; do not silently alter assertions'
          s=s.replace(old,new)
          old="    page.goto(base,wait_until='domcontentloaded')\n    sample=folder_click(page,state['save_dir'],label)"
          new="    expect(page.locator('.brand-word small')).to_have_text('v'+version,timeout=30000)\n    sample=folder_click(page,state['save_dir'],label)"
          assert s.count(old)==1, 'Expected one post-update test navigation'
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          Path('public-evidence/executed-userflow.py').write_text(s,encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual old apps through visible Chrome update button and normal downloaded EXE
        shell: pwsh
        run: |
          python -m pip install playwright==1.55.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/windows_userflow199.py dist/ClipCatch.exe public-evidence --public
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ClipCatch-199-actual-visible-update-evidence
          path: public-evidence/
          retention-days: 30
