name: Verify ClipCatch 2.0.0 patch transport
on:
  push:
    branches: ['release/2.0.0']
    paths: ['.github/workflows/transport-check-2.0.0.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2.0.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      - name: Recover exact patch and validate original digest
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,re,subprocess
          from pathlib import Path
          text=Path('.github/workflows/materialize-2.0.0.yml').read_text()
          payload=''.join(text.split("payload = '''",1)[1].split("'''",1)[0].split())
          Path('transport-payload.txt').write_text(payload)
          payload=payload.replace('GlWUmE9uHXz9','GlWUm9uHXz9')
          patch=gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest()=='2f03bd951dd5a51ab0a9487e0dc2644e30f2fd5520e7d2725440e7a78f634ef8'
          if Path('VERSION').read_text().strip()!='2.0.0':
              subprocess.run(['git','apply','--check','-'],input=patch,check=True)
              subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
      - name: Verify source before committing
        working-directory: src
        run: |
          go test -count=1 -timeout=120s ./...
          go vet ./...
      - name: Commit exact verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION docs/DEVELOPMENT_POLICY.md docs/releases/v2.0.0.md src tests/lifecycle200.py tests/windows_release196.py tests/windows_update198.py tests/windows_userflow199.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'feat: 2.0.0 activity-only updates and last-tab shutdown with Windows upgrade checks'
            git push origin HEAD:refs/heads/release/2.0.0
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipcatch-source-transport-evidence
          path: transport-payload.txt
          retention-days: 2
