name: TEST1912 bundled AI assets
on:
  push:
    branches: [test/1912-hotfix-assets]
    paths: [.github/workflows/test1912-assets.yml]
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Obtain fixed official archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          for os in windows ubuntu; do
            curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 --proto '=https' --proto-redir '=https' "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-${os}.zip" -o "assets/ai-${os}.zip"
          done
          echo 'abc02804e17982a3be33675e4d471e91ea374e65b70167abc09e31acb412802d  assets/ai-windows.zip' | sha256sum -c -
          echo 'e5aa6eb131234b87c0c51f82b89390f5e3e642b7b70f2b9bbe95b6a285a40c96  assets/ai-ubuntu.zip' | sha256sum -c -
          sha256sum assets/*.zip > assets/SHA256SUMS
          unzip -l assets/ai-windows.zip > assets/windows-files.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test1912-reviewed-ai-assets
          path: assets
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
