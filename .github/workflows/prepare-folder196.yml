name: Prepare approved folder-button repair
on:
  push:
    branches: [release/clipcatch-1.9.6]
    paths: [tools/prepare_folder196.py]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/release/clipcatch-1.9.6'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      - name: Apply transparent candidate-only edits and check folder behavior
        run: |
          set -euo pipefail
          python tools/prepare_folder196.py
          gofmt -w src/folder*.go src/main.go
          git diff --check
          (cd src && go test -count=1 -run '^TestFolder' ./...)
      - name: Record candidate changes without merging or publishing
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release/clipcatch-1.9.6
          git rm tools/prepare_folder196.py .github/workflows/prepare-folder196.yml
          git add src tests docs .github/workflows/release.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: open folders visibly through Windows shell and report failures'
          git push origin HEAD:refs/heads/release/clipcatch-1.9.6
          git archive --format=zip --output=ClipCatch-candidate-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ClipCatch-candidate-source
          path: ClipCatch-candidate-source.zip
          retention-days: 14
