name: Prepare ClipCatch 2.0.0 source snapshot
on:
  push:
    branches: ['release/2.0.0']
    paths: ['.github/workflows/prepare-2.0.0.yml']
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3c001a3681294beac6b3e1b3f8adc2c6f793bc52
          persist-credentials: false
      - name: Preserve exact production baseline
        run: git archive --format=zip --output=clipcatch-1.9.9-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: clipcatch-1.9.9-source
          path: clipcatch-1.9.9-source.zip
          retention-days: 3
